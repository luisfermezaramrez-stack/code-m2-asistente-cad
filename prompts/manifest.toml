# Manifiesto de prompts versionados (HU-33, SPEC-034).
#
# Este archivo es la ÚNICA fuente de verdad de las versiones de prompt: cada
# entrada declara el id, la versión, el archivo con el texto y el sha256 del
# texto cargado (el archivo menos su salto de línea final). Agregar una versión
# significa crear un archivo NUEVO (p. ej. planner-v2.txt), añadir su entrada y
# mover `vigente`; nunca editar en el sitio el texto de una versión publicada.
# `make prompts-check` (y el job `lint` del espejo) falla si el sha256 declarado
# no coincide con el contenido: es la garantía de que un cambio de prompt sube
# su versión.

version = 1

[[prompts]]
id = "planner"
version = 1
archivo = "planner-v1.txt"
sha256 = "b64b187dd7b365c37ff7dad4150ecca69eccd3e4a12470c595f63d3b0a41b6d3"
descripcion = "Prompt del planificador: DSL constraint-kit, familias del catálogo y regla de honestidad."
vigente = true

[[prompts]]
id = "editor"
version = 1
archivo = "editor-v1.txt"
sha256 = "3d092432e16850c1a7550b863b8154b2fbc31c821bcc6edbaf40dc80af19015d"
descripcion = "Prompt de edición: aplica la instrucción sobre el programa DSL vigente y respeta la regla de honestidad."
vigente = true
