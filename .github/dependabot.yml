version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: [chore, infra]
    commit-message:
      prefix: "chore"

  # Dependencias de Python / uv (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"   # HU-09: la CI corre sobre PRs a develop
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Kernel CAD fijado al vendor constraint-kit / cadkit:0.1 (HU-01 AC3).
    # Su upgrade es coordinado (vendor pin + Dockerfile + re-validar 113 tests),
    # no un bump de Dependabot.
    ignore:
      - dependency-name: "build123d"
      - dependency-name: "cadquery"
      - dependency-name: "bd-warehouse"
    labels:
      - chore
      - infra
    commit-message:
      prefix: "chore"

  # Acciones de GitHub usadas en los workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - chore
      - infra
    commit-message:
      prefix: "chore"
