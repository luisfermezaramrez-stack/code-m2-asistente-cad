version: 2

updates:
  # Dependencias de Python / uv (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"   # HU-09: la CI corre sobre PRs a develop
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - chore
      - infra
    commit-message:
      prefix: "chore"

  # Acciones de GitHub usadas en los workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - chore
      - infra
    commit-message:
      prefix: "chore"
