# Etiquetas del repositorio (fuente única de verdad).
# Se sincronizan con GitHub mediante .github/workflows/labels.yml
# Formato: name, color (hex sin '#'), description.

# --- Tipo de trabajo ---
- name: bug
  color: d73a4a
  description: "Algo no funciona correctamente"
- name: enhancement
  color: a2eeef
  description: "Nueva funcionalidad o mejora"
- name: documentation
  color: 0075ca
  description: "Mejoras o adiciones a la documentación"
- name: spike
  color: 5319e7
  description: "Investigación técnica acotada en el tiempo (timebox)"
- name: refactor
  color: cfb62e
  description: "Cambio interno sin alterar el comportamiento"
- name: test
  color: 0e8a16
  description: "Pruebas y cobertura"
- name: chore
  color: fef2c0
  description: "Mantenimiento y configuración"

# --- Área técnica (etiquetas del backlog; GitHub compara nombres sin distinguir mayúsculas) ---
- name: ML
  color: 05f244
  description: "Tareas de modelos de IA: inferencia, preparación de datos, prompts y evaluación de resultados"
- name: Backend
  color: "960512"
  description: "Lógica del servidor: procesamiento, API, base de datos, contenedores y despliegue"
- name: Frontend
  color: fbd782
  description: "Interfaz de usuario: pantallas, interacción, visualización y experiencia de uso"
- name: Testing
  color: 5c1a67
  description: "Calidad: pruebas automáticas, integración continua, validación con usuarios y documentación"
- name: infra
  color: bfdadc
  description: "Infraestructura, Docker, entorno y CI/CD"
