name: Sitio de documentación

on:
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "scripts/build_docs_site.py"
      - "README.md"
      - "CONSTITUTION.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "AGENTS.md"
      - "docs/**"
      - "specs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/configure-pages@v5

      - name: Vendorear constraint-kit
        run: bash scripts/vendor-constraint-kit.sh

      - name: Instalar dependencias
        env:
          CFLAGS: "-std=gnu17"
        run: uv sync --locked --dev

      - name: Construir sitio con enlaces estrictos
        run: make docs-build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
