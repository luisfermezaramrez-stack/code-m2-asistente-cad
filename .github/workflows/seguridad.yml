name: Seguridad

# Escaneo de secretos y dependencias (SPEC-029, HU-28). Es un workflow aparte de
# `ci.yml` porque necesita red (descarga de gitleaks y consulta de advisories en
# OSV) y no forma parte de `make check`, que sigue siendo offline.
#
# Herramientas fijadas en src/m2_cad/seguridad_ci.py: gitleaks 8.30.1 y
# pip-audit==2.10.1. `tests/test_ci_parity.py` falla si GitHub, GitLab y el
# módulo dejan de coincidir.
#
# Sin secretos del repositorio y sin `continue-on-error`: un hallazgo bloqueante
# hace fallar el job, y la única vía de aceptarlo es una excepción justificada y
# con fecha en security/ (ver security/politica-excepciones.md).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Historial completo: el escaneo cubre todos los commits, no solo el último.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"

      - name: Escanear secretos con gitleaks 8.30.1
        run: make security-secretos

  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.5"

      - name: Vendorear constraint-kit
        # `uv export --locked` necesita la fuente local del kernel para generar
        # sus metadatos; sin el vendor falla antes de auditar nada.
        run: bash scripts/vendor-constraint-kit.sh

      - name: Auditar dependencias con pip-audit 2.10.1
        # Exporta `uv.lock` y audita con `uvx --from pip-audit==2.10.1`: la
        # gestión de Python pasa por uv, nunca por pip.
        run: make security-dependencias
