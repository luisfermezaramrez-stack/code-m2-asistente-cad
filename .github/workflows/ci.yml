name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Una sola fuente de verdad para la version de Python (local y CI).
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --dev

      - name: Ruff (reglas E, F, I, B)
        run: uv run ruff check src tests

      - name: Pytest con cobertura (umbral en [tool.coverage.report])
        run: uv run pytest --cov=src/m2_cad --cov-report=term-missing
