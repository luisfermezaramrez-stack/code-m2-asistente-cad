name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Una sola fuente de verdad para la version de Python (local y CI).
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Vendorear constraint-kit
        # Source local fijado y parcheado antes de instalar desde uv.lock.
        run: bash scripts/vendor-constraint-kit.sh

      - name: Instalar dependencias
        # python-solvespace 3.0.8 no publica wheels para Linux: se compila desde
        # sdist y su mimalloc incluido usa ATOMIC_VAR_INIT, simbolo eliminado en
        # C23. La imagen ubuntu-latest compila en C23 por defecto (gcc 15), asi
        # que se fija C17 para los sdists, igual que en Docker.
        env:
          CFLAGS: "-std=gnu17"
        run: uv sync --locked --dev

      - name: Instalar frontend desde lockfile
        run: make frontend-install

      - name: Ruff, Vitest, TypeScript, build integrado y pytest con cobertura
        run: make check

      - name: Arranque integrado HTTP (modelo y traductor simulados, CAD real)
        run: uv run --no-sync python scripts/verify_hu15_deployment.py --simulate-model
