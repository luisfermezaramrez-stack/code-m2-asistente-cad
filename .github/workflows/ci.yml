name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  titulo-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"

      - name: Validar título convencional HU-55
        env:
          PYTHONPATH: src
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --no-project python scripts/generar_release.py --titulo

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Una sola fuente de verdad para la version de Python (local y CI).
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Vendorear constraint-kit
        # Source local fijado y parcheado antes de instalar desde uv.lock.
        run: bash scripts/vendor-constraint-kit.sh

      - name: Instalar dependencias
        # python-solvespace 3.0.8 no publica wheels para Linux: se compila desde
        # sdist y su mimalloc incluido usa ATOMIC_VAR_INIT, simbolo eliminado en
        # C23. La imagen ubuntu-latest compila en C23 por defecto (gcc 15), asi
        # que se fija C17 para los sdists, igual que en Docker.
        env:
          CFLAGS: "-std=gnu17"
        run: uv sync --locked --dev

      - name: Instalar frontend desde lockfile
        run: make frontend-install

      - name: Preparar secreto efímero para pruebas HU-36
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fichero:
              fichero.write("M2_DOWNLOAD_SECRET=" + secrets.token_hex(32) + "\n")
          PY

      - name: Ruff, contrato OpenAPI, Vitest, TypeScript, build integrado y cobertura
        run: make check

      - name: Corpus dorado del núcleo determinista
        # HU-23: construye cada programa del corpus y compara con la huella congelada.
        # Sin GPU, sin red y sin API key.
        run: make corpus-dorado

      - name: Banco en replay con respuestas grabadas
        # HU-44: corre el pipeline real con respuestas versionadas, sin red, API key
        # ni tokens; falla si la tasa de aceptación baja del umbral (por defecto 1.0).
        run: make bench-replay

      - name: Comparar el banco contra el baseline de calidad
        # HU-46: sin red, key ni tokens; falla si alguna métrica empeora más allá
        # de los umbrales versionados en data/alertas_baseline.json.
        run: make alertas

      - name: Arranque integrado HTTP (modelo simulado, sin traducción, CAD real)
        run: uv run --no-sync python scripts/verify_hu15_deployment.py --simulate-model

  e2e:
    # SPEC-042 (HU-41): el flujo completo de la SPA en un navegador real contra el
    # backend simulado que el propio test intercepta. Sin red externa, sin API key,
    # sin GPU y sin kernel CAD: solo Node y Chromium (RF-5, RNF-1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Instalar frontend desde lockfile
        run: make frontend-install

      - name: Instalar solo Chromium de Playwright
        # Un solo navegador basta (Supuesto de SPEC-042); --with-deps trae las
        # bibliotecas del sistema que Chromium necesita en el runner.
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Suite E2E sobre el build real con backend simulado
        run: make e2e

      - name: Publicar captura y traza del fallo
        # AC2: ante un fallo quedan la captura (screenshot: only-on-failure), la
        # traza (trace: retain-on-failure) y el reporte HTML.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: [test, e2e]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'luisfermezaramrez-stack/code-m2-asistente-cad'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"

      - name: Preparar changelog y versión
        id: preparar
        run: |
          set -e
          if uv run --no-project python scripts/generar_release.py \
            --preparar --notas "$RUNNER_TEMP/release-notes.md"; then
            echo "sin_cambios=false" >> "$GITHUB_OUTPUT"
          else
            codigo=$?
            if [ "$codigo" -eq 2 ]; then
              echo "sin_cambios=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$codigo"
          fi
          version=$(uv run --no-project python scripts/generar_release.py --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publicar etiqueta y release
        if: steps.preparar.outputs.sin_cambios != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.preparar.outputs.version }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$VERSION"
            git push origin HEAD:main
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
