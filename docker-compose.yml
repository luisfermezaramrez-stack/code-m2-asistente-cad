services:
  # HU-01: servidor llama.cpp que sirve el GGUF Q6_K en la GPU.
  # El resto del sistema lo invoca vía LLM_BASE_URL.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      --model /models/gemma4-12b-constraintkit-grpo-Q6_K.gguf
      --ctx-size 8192
      --n-gpu-layers 999
      --host 0.0.0.0
      --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  m2-cad:
    build: .
    ports:
      - "8000:8000"   # FastAPI
    environment:
      LLM_BASE_URL: http://llama:8080
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    depends_on:
      - llama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # HU-08: interfaz web Gradio
  m2-cad-ui:
    build: .
    command: ["uv", "run", "python", "-m", "m2_cad.interfaz"]
    ports:
      - "7860:7860"
    environment:
      M2_API_URL: http://m2-cad:8000
      M2_UI_HOST: 0.0.0.0
      M2_UI_PORT: "7860"
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      - m2-cad