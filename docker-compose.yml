services:
  # HU-01: servidor llama.cpp que sirve el GGUF Q6_K en la GPU.
  # El resto del sistema lo invoca vía LLM_BASE_URL.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      --model /models/gemma4-12b-constraintkit-grpo-Q6_K.gguf
      --ctx-size 8192
      --n-gpu-layers 999
      --host 0.0.0.0
      --port 8080
    ports:
      - "127.0.0.1:8080:8080"  # Diagnóstico local del modelo; no es la UI.
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  m2-cad:
    build: .
    ports:
      - "8000:8000"   # Vue, API, SSE y archivos en el mismo origen.
    environment:
      LLM_BASE_URL: http://llama:8080
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      M2_CORS_ORIGINS: "${M2_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    depends_on:
      - llama
