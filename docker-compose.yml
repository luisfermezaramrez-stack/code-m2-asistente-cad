services:
  # HU-01: servidor llama.cpp que sirve el GGUF Q6_K en la GPU.
  # El resto del sistema lo invoca vía LLM_BASE_URL.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      --model /models/gemma4-12b-constraintkit-grpo-Q6_K.gguf
      --ctx-size 8192
      --n-gpu-layers 999
      --host 0.0.0.0
      --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  m2-cad:
    build: .
    ports:
      - "8000:8000"   # FastAPI
      - "7860:7860"   # Gradio
    environment:
      LLM_BASE_URL: http://llama:8080
    volumes:
      - ./data:/app/data
    depends_on:
      - llama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
