# Excepciones de secretos — SPEC-029 (HU-28)
#
# Política completa: security/politica-excepciones.md
#
# Este archivo es la ÚNICA forma de aceptar un hallazgo de `gitleaks`. Mientras
# esté vacío, cualquier secreto detectado bloquea el job `secretos`.
#
# Esquema de cada entrada (todas las claves son obligatorias):
#
#   [[excepciones]]
#   archivo = "ruta/relativa/al/archivo"   # tal como lo reporta gitleaks (File)
#   linea = 12                             # línea del hallazgo (StartLine)
#   regla = "generic-api-key"              # id de la regla (RuleID)
#   justificacion = "Por qué no se puede rotar ni retirar del historial."
#   aprobado_por = "Nombre Apellido"       # quien aprueba; nadie aprueba lo suyo
#   revision = "2026-12-31"                # fecha ISO: hoy o después, máximo 180 días
#
# `justificacion` explica por qué el hallazgo no se puede corregir y tiene 20
# caracteres como mínimo. Una `revision` vencida hace fallar el job: la excepción
# deja de valer y el hallazgo vuelve a bloquear. La entrada se conserva en el
# repositorio y aparece siempre en el log del job, nunca se borra en silencio.
#
# ESTADO ACTUAL: no hay excepciones aprobadas. El archivo solo documenta el
# esquema; ninguna credencial real ha sido aceptada por esta vía.

# (sin entradas)
