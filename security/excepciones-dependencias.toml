# Excepciones de dependencias — SPEC-029 (HU-28)
#
# Política completa: security/politica-excepciones.md
#
# Este archivo es la ÚNICA forma de aceptar un advisory de `pip-audit`. Mientras
# esté vacío, todo hallazgo bloqueante (con corrección publicada, severidad alta
# o crítica, o severidad no clasificable) hace fallar el job `dependencias`.
#
# Esquema de cada entrada (todas las claves son obligatorias):
#
#   [[excepciones]]
#   advisory = "PYSEC-2026-1475"           # id del advisory o su CVE
#   paquete = "jinja2"                     # paquete instalado que lo arrastra
#   justificacion = "Por qué no se puede actualizar el paquete ahora."
#   aprobado_por = "Nombre Apellido"       # quien aprueba; nadie aprueba lo suyo
#   revision = "2026-12-31"                # fecha ISO: hoy o después, máximo 180 días
#
# `justificacion` explica por qué el hallazgo no se puede corregir y tiene 20
# caracteres como mínimo. Una `revision` vencida hace fallar el job: la excepción
# deja de valer y el hallazgo vuelve a bloquear. La entrada se conserva en el
# repositorio y aparece siempre en el log del job, nunca se borra en silencio.
#
# ESTADO ACTUAL: `pillow` se actualizó a 13.0.0 (corrige sus advisories) y quedan
# cuatro excepciones aprobadas: tres de `vtk`, porque su versión la fija el kernel
# CAD vendoreado, y una de `diskcache`, que no tiene corrección publicada.

# vtk 9.3.1: la versión la fija el kernel CAD. `cadquery-ocp 7.8.1.1.post1`
# (el que ata el vendor `cadkit:0.1`) exige `vtk==9.3.1`, así que corregirlo
# implica subir el kernel OCC, que cambia la geometría y la huella del corpus
# dorado: es una decisión de otra HU, no de esta puerta de CI.
[[excepciones]]
advisory = "PYSEC-2025-224"
cve = "CVE-2025-57106"
paquete = "vtk"
justificacion = "vtk 9.3.1 lo fija el kernel CAD: cadquery-ocp 7.8.1.1.post1 exige vtk==9.3.1. Subir vtk obliga a cambiar el kernel OCC vendoreado (cadkit:0.1) y a recongelar el corpus dorado por el cambio de geometría; se revisa cuando se planifique ese salto."
aprobado_por = "Aprobador del PR de HU-28"
revision = "2027-05-25"

