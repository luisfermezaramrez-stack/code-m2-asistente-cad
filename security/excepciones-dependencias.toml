# diskcache 5.6.3: no hay versión corregida publicada; entra por llama-cpp-python
# (`uv tree --invert --package diskcache`), no por mlflow.
[[excepciones]]
advisory = "PYSEC-2026-2447"
cve = "CVE-2025-69872"
paquete = "diskcache"
justificacion = "Sin versión corregida publicada: 5.6.3 es la última. Llega como dependencia transitiva de llama-cpp-python, que solo la usa en LlamaDiskCache; src/m2_cad no habilita esa caché, así que no se deserializa ningún directorio de caché en disco. Se retira en cuanto haya corrección o si se activa una caché en disco."
aprobado_por = "Aprobador del PR de HU-28"
revision = "2027-05-25"
