justificacion = "Mismo pin del kernel CAD que PYSEC-2025-224: vtk 9.3.1 es la versión exacta que exige cadquery-ocp 7.8.1.1.post1, y corregirlo exige subir el kernel OCC vendoreado y recongelar el corpus dorado."
aprobado_por = "Aprobador del PR de HU-28"
revision = "2027-05-25"

