repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=50000"]   # bloquea pesos (GGUF) de 9,8 GB
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  # AC4 de HU-09: un archivo de pesos se bloquea por extension, sin importar
  # su tamano (una descarga parcial tambien debe frenarse).
  - repo: local
    hooks:
      - id: no-model-weights
        name: Bloquear archivos de pesos (.gguf, .safetensors, ...)
        entry: bash scripts/check-weights.sh
        language: system
        files: '\.(gguf|safetensors|pt|pth|onnx|h5|keras|ckpt)$'
