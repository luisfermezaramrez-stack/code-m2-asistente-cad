[project]
name = "m2-cad"
version = "0.1.0"
description = "Asistente CAD para el diseño preliminar de componentes metálicos auxiliares"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cadquery==2.7.0",
    "build123d==0.10.0",
    "bd_warehouse==0.2.0",
    "z3-solver>=4.12",
    "python-solvespace>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gradio>=4.0",
    "llama-cpp-python>=0.3",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m2_cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/m2_cad"]

# AC2 de HU-09: la CI y `make cov` fallan si la cobertura de src/ baja del 70 %.
[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
