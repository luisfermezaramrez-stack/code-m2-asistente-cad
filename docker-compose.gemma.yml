# HEREDADO (HU-01) — línea base con Gemma 4 12B ConstraintKit servido por llama.cpp.
# Desde HU-14 el modelo por defecto es la API de DeepSeek; este override solo sirve
# para reproducir la línea base de Gemma (comparación del AC7 de HU-14).
#
#   make model-fetch
#   docker compose -f docker-compose.yml -f docker-compose.gemma.yml up
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      --model /models/gemma4-12b-constraintkit-grpo-Q6_K.gguf
      --ctx-size 8192
      --n-gpu-layers 999
      --host 0.0.0.0
      --port 8080
    ports:
      - "127.0.0.1:8080:8080"  # Diagnóstico heredado, nunca expuesto a la LAN.
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  m2-cad:
    environment:
      LLM_BASE_URL: http://llama:8080
      LLM_MODEL: gemma4-12b-constraintkit
    depends_on:
      - llama
