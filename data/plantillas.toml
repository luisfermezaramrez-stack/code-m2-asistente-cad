unidad = "mm"
defecto = 40
minimo = 10
maximo = 200

[[plantillas.parametros]]
nombre = "bend_radius"
etiqueta = "Radio de plegado"
unidad = "mm"
defecto = 2
minimo = 0.5
maximo = 20

[plantillas.programa]
mates = []

[[plantillas.programa.parts]]
id = "p"
type = "sheet_bracket"
material = "steel"

[plantillas.programa.parts.params]
thickness = 3
base_length = 80
flange_length = 60
width = 40
