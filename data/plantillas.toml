# Catálogo versionado de plantillas de pieza (SPEC-050, HU-49).
#
# Cada plantilla declara el tipo del motor, la familia del banco, su programa DSL
# completo con valores por defecto y los parámetros que el usuario puede ajustar
# (nombre, etiqueta, unidad, defecto, mínimo y máximo). El material es explícito y
# pasa por el mismo guard que el flujo por texto.
#
# - Los valores por defecto son los que se construyen si el usuario no toca nada.
# - `make plantillas-check` verifica tipos, familias, rangos y que el programa base
#   pase el verificador determinista.
# - Es un archivo de datos: para añadir una plantilla se agrega una entrada y se
#   revisa en el PR, sin tocar código.

version = 1
unidad_defecto = "mm"

[[plantillas]]
id = "placa-con-agujeros"
nombre = "Placa con agujeros"
descripcion = "Placa rectangular con una corona de agujeros pasantes."
tipo = "plate"
familia = "plate"

[[plantillas.parametros]]
nombre = "width"
etiqueta = "Ancho"
unidad = "mm"
defecto = 100
minimo = 20
maximo = 300

[[plantillas.parametros]]
nombre = "depth"
etiqueta = "Fondo"
unidad = "mm"
defecto = 60
minimo = 20
maximo = 300

[[plantillas.parametros]]
nombre = "thick"
etiqueta = "Espesor"
unidad = "mm"
defecto = 6
minimo = 2
maximo = 50

[[plantillas.parametros]]
nombre = "bolt_d"
etiqueta = "Diámetro de agujero"
unidad = "mm"
defecto = 10
minimo = 3
maximo = 30

[[plantillas.parametros]]
nombre = "bolt_circle"
etiqueta = "Círculo de agujeros"
unidad = "mm"
defecto = 70
minimo = 10
maximo = 250

[[plantillas.parametros]]
nombre = "bolt_count"
etiqueta = "Cantidad de agujeros"
unidad = "u"
defecto = 4
minimo = 1
maximo = 12
entero = true

[plantillas.programa]
mates = []

[[plantillas.programa.parts]]
id = "p"
type = "plate"
material = "steel"

[plantillas.programa.parts.params]
width = 100
depth = 60
thick = 6
boss_d = 0
boss_h = 0
bolt_d = 10
bolt_circle = 70
bolt_count = 4

[[plantillas]]
id = "escuadra-de-chapa"
nombre = "Escuadra de chapa"
descripcion = "Escuadra en L de espesor constante."
tipo = "sheet_bracket"
familia = "sheet_bracket"

[[plantillas.parametros]]
nombre = "thickness"
etiqueta = "Espesor"
unidad = "mm"
defecto = 3
minimo = 1
maximo = 12

[[plantillas.parametros]]
nombre = "base_length"
