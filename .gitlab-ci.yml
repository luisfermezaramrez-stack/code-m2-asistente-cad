# Pipeline de GitLab: valida cada rama replicada y, desde la rama por defecto,
# publica la imagen y la despliega en el droplet.
#
# GitHub sigue siendo la fuente de verdad: `.github/workflows/espejo-gitlab.yml`
# replica ramas y etiquetas en este repositorio, y cada push replicado dispara
# el pipeline. Validar no reemplaza la puerta del PR en GitHub; publicar y
# desplegar quedan reservados a la rama por defecto.

variables:
  # --- imagen ---------------------------------------------------------------
  # Versión de uv fijada, igual que en GitHub Actions y en el Dockerfile.
  UV_VERSION: "0.13.5"
  # `.python-version` es la única fuente de verdad de la versión de Python
  # (CONSTITUTION.md). Acá se repite porque el tag de la imagen no puede leer un
  # archivo; `tests/test_ci_parity.py` falla si los dos valores divergen.
  PYTHON_VERSION: "3.12"
  BASE_LAYER: trixie-slim
  # Imagen publicada por `build_image` y desplegada por `deploy`.
  IMAGE_NAME: "luismeza2026/code"
  IMAGE_TAG: "GDPIACD_2026_2S"
  # python-solvespace 3.0.8 no publica wheels para Linux y su mimalloc incluido
  # usa ATOMIC_VAR_INIT, símbolo eliminado en C23: los sdists se compilan en C17,
  # igual que en GitHub Actions y en Docker.
  CFLAGS: "-std=gnu17"
  # llama-cpp-python 0.3.36 solo publica sdist: con el paralelismo por defecto
  # dos traducciones C++ pesadas a la vez agotan los 8 GB del runner compartido.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  # GitLab monta el directorio de build en otro filesystem: uv no puede usar
  # hard links entre el cache y el proyecto, así que copia los archivos.
  UV_LINK_MODE: copy
  # Donde uv descarga los paquetes. Tiene que coincidir con "cache.paths".
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  # En CI no se resuelven versiones nuevas: eso se decide en desarrollo.
  UV_FROZEN: "1"
  # La imagen ya trae el intérprete: si uv intentara bajar otro, que falle rápido.
  UV_PYTHON_DOWNLOADS: never
  # Logs sin buffer: aparecen en tiempo real, no al final del job.
  PYTHONUNBUFFERED: "1"
  # pytest lee esta variable y agrega el reporte JUnit sin modificar el Makefile.
  PYTEST_ADDOPTS: "--junitxml=report.xml"
  GIT_DEPTH: "1"

image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER

workflow:
  # Si llegan dos pushes seguidos, el pipeline anterior se cancela solo: no
  # tiene sentido gastar minutos validando un commit que ya quedó viejo.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Un tag no dispara pipeline: solo interesa validar ramas.
    - if: $CI_COMMIT_TAG
      when: never
    # Ante un push replicado por el espejo.
    - if: $CI_PIPELINE_SOURCE == "push"
    # "Run pipeline" desde la web: tras cambiar una variable (un usuario, un
    # secreto) se vuelve a desplegar sin push. Reintentar un pipeline viejo no
    # sirve: las reglas de los jobs se evalúan al crearlo y ahí no había deploy.
    - if: $CI_PIPELINE_SOURCE == "web"

# Etapas secuenciales.
stages:
  - quality
  - test
  - build
  - deploy

# Configuración compartida por todos los jobs.
default:
  # Si un job se cuelga, falla en vez de consumir una hora de runner.
  timeout: 20 minutes
  # Permite que auto_cancel lo interrumpa.
  interruptible: true
  cache:
    # La clave sale del hash de estos dos archivos: si cambian las dependencias
    # se arma un cache nuevo; si no, se reutiliza el anterior.
    key:
      files:
        - pyproject.toml
        - uv.lock
      # Un cache por job: "lint" instala solo el grupo dev y "run_test" el
      # entorno completo; con una clave compartida cada job pisaría al otro.
      prefix: $CI_JOB_NAME
    paths:
      - .uv-cache/

# -----------------------------------------------------------------------------
# Job 1: calidad de código. No necesita el kernel CAD ni el frontend, solo Ruff.
# Feedback barato: si el estilo está mal, no gasta minutos instalando todo.
# -----------------------------------------------------------------------------
lint:
  stage: quality
  # El `uv run` que invoca el Makefile no debe sincronizar: en este job el
  # entorno ya está instalado y el kernel vendoreado todavía no existe.
  variables:
    UV_NO_SYNC: "1"
  before_script:
    # La imagen de uv no trae make y el Makefile es la fuente de verdad de los
    # comandos; instalarlo cuesta segundos comparado con el entorno completo.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends make
    - rm -rf /var/lib/apt/lists/*
  script:
    # --only-group dev instala solo el grupo dev (ruff, pytest, pre-commit) y
    # --no-install-project omite empaquetar el proyecto, que acá no se usa.
    - uv sync --only-group dev --no-install-project
    # `ruff check .` recorrería `.agents/`, donde viven plantillas con
    # placeholders ({{#if PACKAGE}}) que no son TOML válido: se usa el Makefile.
    # --no-sync evita que "uv run" vuelva a sincronizar el entorno.
    - uv run --no-sync make lint
    # HU-33/AC2: también falla si un prompt cambió sin subir su versión.
    - uv run --no-sync make prompts-check
    # HU-48/RF-3: la tabla versionada de materiales y precios también se valida acá.
    - uv run --no-sync make materiales-check
    # HU-49/RF-1: el catálogo de plantillas también se valida en el espejo.
    - uv run --no-sync make plantillas-check
    # HU-47/RNF-3: la configuración cloud se valida sin red, igual que en `make check`.
    - uv run --no-sync make cloud-config-check
    - uv run --no-sync ruff format --check src tests

# -----------------------------------------------------------------------------
# Job 2: escaneo de secretos (SPEC-029, HU-28). Mismo comando que en GitHub
# Actions; la herramienta y su sha256 viven fijadas en src/m2_cad/seguridad_ci.py
# (gitleaks 8.30.1 y pip-audit==2.10.1). Sin secretos del repositorio.
# -----------------------------------------------------------------------------
secretos:
  stage: quality
  # Historial completo: se escanean todos los commits, no solo el último.
  variables:
    GIT_DEPTH: "0"
  before_script:
    # `gitleaks git` necesita git para leer el historial; la imagen no lo trae.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends make git
    - rm -rf /var/lib/apt/lists/*
  script:
    # Descarga el gitleaks fijado, verifica su sha256 y escanea el historial.
    - make security-secretos

# -----------------------------------------------------------------------------
# Job 3: auditoría de dependencias. Exporta uv.lock con `uv export` y audita con
# `uvx --from pip-audit==2.10.1`; nunca instala nada con pip.
# -----------------------------------------------------------------------------
dependencias:
  stage: quality
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends make git
    - rm -rf /var/lib/apt/lists/*
  script:
    # `uv export --locked` necesita la fuente local del kernel para generar sus
    # metadatos: sin el vendor la auditoría falla antes de empezar.
    - bash scripts/vendor-constraint-kit.sh
    - make security-dependencias

# -----------------------------------------------------------------------------
# Job 4: pruebas. Necesita el entorno completo, el kernel vendoreado y Node,
# porque `make test` construye el frontend antes de correr pytest. Corre los
# mismos comandos que un integrante en su máquina.
# -----------------------------------------------------------------------------
run_test:
  stage: test
  # `make test` depende de `frontend-build` (npm): la imagen de uv no trae Node.
  # Se usa la misma versión mayor que GitHub Actions.
  image: node:24-bookworm
  # El Python de `.python-version` se instala en este job, así que habilita la
  # descarga del intérprete (el `never` global es para las imágenes de uv).
  variables:
    UV_PYTHON_DOWNLOADS: "automatic"
  # Compilar los sdists de llama-cpp-python y python-solvespace no entra en el
  # timeout por defecto.
  timeout: 45 minutes
  before_script:
    # Bibliotecas nativas del kernel CAD: los wheels manylinux de OpenCascade y
    # VTK enlazan contra GL/X11 y fallan al importar sin ellas.
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends
      make libgl1 libglib2.0-0 libxcb1 libx11-6 libxext6 libsm6 libxrender1
    # Los índices de apt ya no sirven: liberan espacio en el runner.
    - rm -rf /var/lib/apt/lists/*
    - curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
    - ln -sf "$HOME/.local/bin/uv" /usr/local/bin/uv
    - ln -sf "$HOME/.local/bin/uvx" /usr/local/bin/uvx
    # `.python-version` es la única fuente de verdad de la versión de Python.
    - uv python install "$(cat .python-version)"
    # HU-36: las pruebas de descargas exigen una clave. Se genera una efímera por
    # corrida, sin guardar ninguna clave real en el repositorio ni en GitLab.
    - export M2_DOWNLOAD_SECRET=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
    # Si falta una herramienta, falla acá con su nombre y no a mitad del build.
    - command -v git make gcc g++ node npm uv
  script:
    # vendor/constraint-kit está gitignored y lo exige [tool.uv.sources].
    - bash scripts/vendor-constraint-kit.sh
    - uv sync --locked --dev
    # Lockfile del frontend, sin resolver versiones nuevas.
    - make frontend-install
    # Build Vue + pytest, igual que en local.
    - make test
  artifacts:
    # Se publica incluso si las pruebas fallan: el reporte es justamente lo que
    # uno necesita mirar cuando están en rojo.
    when: always
    expire_in: 1 week
    paths:
      - report.xml
    reports:
      junit: report.xml

# -----------------------------------------------------------------------------
# Job 5: E2E de la SPA con Playwright (SPEC-042, HU-41). El backend está
# simulado por el propio test (`page.route` sobre `/v1`): no necesita kernel CAD,
# API key ni red externa, solo Node y Chromium.
# -----------------------------------------------------------------------------
e2e:
  stage: test
  image: node:24-bookworm
  timeout: 30 minutes
  # No usa uv ni genera .uv-cache/.
  cache: {}
  before_script:
    # Lockfile del frontend, sin resolver versiones nuevas.
    - npm --prefix frontend ci
    # Un solo navegador (Supuesto de SPEC-042); --with-deps trae sus bibliotecas.
    - (cd frontend && npx playwright install --with-deps chromium)
  script:
    # Los mismos pasos que `make e2e` en local y en GitHub: build real + suite.
    - npm --prefix frontend run build
    - npm --prefix frontend run e2e
  artifacts:
    # AC2: ante un fallo quedan la captura, la traza y el reporte HTML.
    when: on_failure
    expire_in: 1 week
    paths:
      - frontend/test-results/
      - frontend/playwright-report/

# -----------------------------------------------------------------------------
# Job 6: imagen Docker de la entrega, verificada antes de publicarse.
# -----------------------------------------------------------------------------
build_image:
  stage: build
  # Solo en la rama por defecto. Si cualquier rama construyera, una feature
  # pisaría :latest y la imagen "oficial" dejaría de ser la de main. Además
  # REGISTRY_USER y REGISTRY_PASS son protected: fuera de main llegan vacías.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # El build compila python-solvespace dentro del Dockerfile.
  timeout: 45 minutes
  # Este job no usa uv ni genera .uv-cache/.
  cache: {}
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  image: docker:29.10.0-cli
  services:
    - docker:29.10.0-dind
  before_script:
    # docker login siempre avisa que guarda las credenciales sin cifrar. El aviso
    # es ruido; el fallo real no: se guarda la salida y solo se imprime al fallar.
    - >
      echo "$REGISTRY_PASS" | docker login -u "$REGISTRY_USER" --password-stdin
      > /tmp/docker-login.log 2>&1
      || { cat /tmp/docker-login.log; exit 1; }
  script:
    # -q y stderr mudo: en el primer build la imagen todavía no existe y el
    # "manifest not found" del pull es esperado, no un error.
    - docker pull -q "$IMAGE_NAME:latest" > /dev/null 2>&1 || true
    # La imagen final del Dockerfile es la API (stage sin nombre): no hay --target.
    - >
      docker build
      --cache-from $IMAGE_NAME:latest
      --build-arg BUILDKIT_INLINE_CACHE=1
      -t $IMAGE_NAME:$IMAGE_TAG
      -t $IMAGE_NAME:latest
      .
    # Smoke antes de publicar: la imagen tiene que quedar healthy por sí sola.
    # Su HEALTHCHECK pega contra /v1/health; además se pide la SPA en "/".
    # Sin sesión (M2_AUTH_ENABLED=0) y con una clave de descargas efímera: el
    # smoke no necesita ni recibe secretos reales.
    - |
      SECRETO=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
      docker run -d --name m2-smoke \
        -e M2_AUTH_ENABLED=0 -e M2_DOWNLOAD_SECRET="$SECRETO" \
        $IMAGE_NAME:$IMAGE_TAG
      H=""
      for i in $(seq 1 30); do
        H=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}sin-healthcheck{{end}}' m2-smoke 2>/dev/null || echo desconocido)
        echo "api health=$H (intento $i/30)"
        [ "$H" = "healthy" ] && break
        if [ "$H" = "unhealthy" ] || [ "$H" = "sin-healthcheck" ]; then break; fi
        sleep 5
      done
      if [ "$H" != "healthy" ]; then
        docker logs --tail 60 m2-smoke || true
        docker rm -f m2-smoke >/dev/null 2>&1 || true
        exit 1
      fi
      # En una sola línea: dentro de este bloque, un salto de línea llegaría a
      # Python como indentación y el smoke fallaría por sintaxis.
      SMOKE="from urllib.request import urlopen; b = 'http://127.0.0.1:8000'; print('health HTTP', urlopen(b + '/v1/health', timeout=4).status); print('SPA HTTP', urlopen(b + '/', timeout=4).status)"
      if ! docker exec m2-smoke /app/.venv/bin/python -c "$SMOKE"; then
        docker logs --tail 60 m2-smoke || true
        docker rm -f m2-smoke >/dev/null 2>&1 || true
        exit 1
      fi
      docker rm -f m2-smoke >/dev/null
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest

# -----------------------------------------------------------------------------
# Job 7: deploy al droplet por SSH: API + worker (HU-45) desde la misma imagen.
# Se salta solo mientras no exista DO_HOST: sin droplet configurado no hay a
# dónde desplegar, y un pipeline en rojo por eso no informa nada útil.
# -----------------------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine:3.22
  needs: ["build_image"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DO_HOST
  # No usa uv: mismo criterio que build_image.
  cache: {}
  environment:
    name: production
    url: "http://$DO_HOST:$APP_PORT"
  # Evita dos deploys simultáneos si llegan dos pushes seguidos.
  resource_group: production
  # auto_cancel no puede cortarlo a mitad de camino: entre `docker rm -f` y el
  # arranque del worker, producción quedaría sin API o sin quien procese la cola.
  interruptible: false
  variables:
    APP_PORT: "8000"
    API_CONTAINER: "m2-cad"
    WORKER_CONTAINER: "m2-cad-worker"
    # En el droplet: el env-file con los secretos vive acá, con permisos 600.
    REMOTE_DIR: "/opt/m2-cad"
    # Copia normalizada de SSH_PRIVATE_KEY (ver before_script).
    DEPLOY_KEY: "/tmp/m2-deploy-key"
    # Topes de memoria por contenedor: ajustarlos al tamaño del droplet para
    # dejar aire al OS y a dockerd. El worker es el que construye las piezas.
    API_MEMORY: "1g"
    WORKER_MEMORY: "1500m"
  before_script:
    - apk add --no-cache openssh-client
    # SSH_PRIVATE_KEY es una variable de tipo File: llega como ruta temporal y
    # GitLab la escribe tal cual. Si se pegó sin salto de línea final, ssh no la
    # carga ("error in libcrypto"): se copia agregándolo. $(...) quita los saltos
    # finales que hubiera y printf deja exactamente uno.
    - printf '%s\n' "$(cat "$SSH_PRIVATE_KEY")" > "$DEPLOY_KEY"
    - chmod 600 "$DEPLOY_KEY"
    # Sin estos secretos la API no arranca (HU-14, HU-36, HU-53): se corta acá,
    # con el nombre de la variable, en vez de dejar un contenedor reiniciándose.
    - ': "${DEEPSEEK_API_KEY:?Defina DEEPSEEK_API_KEY en las variables de GitLab}"'
    - ': "${M2_DOWNLOAD_SECRET:?Defina M2_DOWNLOAD_SECRET en las variables de GitLab}"'
    - ': "${M2_AUTH_SECRET:?Defina M2_AUTH_SECRET en las variables de GitLab}"'
    - ': "${M2_AUTH_USERS:?Defina M2_AUTH_USERS en las variables de GitLab}"'
  script:
    # La imagen está en Docker Hub PÚBLICO: el droplet no necesita credenciales.
    # Por eso no hay docker login (ni el password viajando por SSH).
    - |
      SSH="ssh -o BatchMode=yes -o ConnectTimeout=10 \
        -o StrictHostKeyChecking=accept-new -i $DEPLOY_KEY root@$DO_HOST"

      # Los secretos viajan por stdin a un env-file 600, nunca en la línea de
      # comandos de `docker run` (quedarían en `ps` y en el historial del host).
      # HTTP sin TLS: la cookie de sesión no puede ser Secure o el navegador no
      # la devuelve. Para HTTPS está el compose cloud de HU-47 (runbook-cloud.md).
      printf '%s\n' \
        "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" \
        "LLM_MODEL=${LLM_MODEL:-deepseek-v4-pro}" \
        "M2_AUTH_ENABLED=1" \
        "M2_AUTH_COOKIE_SECURE=0" \
        "M2_AUTH_SECRET=$M2_AUTH_SECRET" \
        "M2_AUTH_USERS=$M2_AUTH_USERS" \
        "M2_CORS_ORIGINS=http://$DO_HOST:$APP_PORT" \
        "M2_COLA_HABILITADA=1" \
        "M2_COLA_PATH=/app/data/cola.json" \
        "M2_DOWNLOAD_SECRET=$M2_DOWNLOAD_SECRET" \
        "M2_LOG_LEVEL=${M2_LOG_LEVEL:-INFO}" \
        "MLFLOW_TRACKING_ENABLED=0" \
        | $SSH "umask 077 && mkdir -p $REMOTE_DIR && cat > $REMOTE_DIR/m2-cad.env"

      $SSH "docker pull -q $IMAGE_NAME:$IMAGE_TAG"

      # rm -f es idempotente: primer deploy y redeploy usan el mismo camino.
      # Los volúmenes con nombre conservan la cola, los artefactos y los respaldos.
      $SSH "docker rm -f $WORKER_CONTAINER $API_CONTAINER >/dev/null 2>&1 || true"

      $SSH "docker run -d --restart unless-stopped \
        --name $API_CONTAINER \
        --memory $API_MEMORY \
        --env-file $REMOTE_DIR/m2-cad.env \
        -p $APP_PORT:8000 \
        -v m2-cad-data:/app/data \
        -v m2-cad-outputs:/app/outputs \
        $IMAGE_NAME:$IMAGE_TAG"
    - |
      SSH="ssh -o BatchMode=yes -o ConnectTimeout=10 \
        -o StrictHostKeyChecking=accept-new -i $DEPLOY_KEY root@$DO_HOST"

      # El HEALTHCHECK de la imagen (/v1/health) es lo que se espera: el worker
      # arranca después de la API, como en el runbook operativo.
      for i in $(seq 1 36); do
        HEALTH=$($SSH "docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}sin-healthcheck{{end}}' $API_CONTAINER" 2>/dev/null || echo desconocido)
        echo "api health=$HEALTH (intento $i/36)"

        if [ "$HEALTH" = "healthy" ]; then
          # El worker no escucha en 8000: el HEALTHCHECK de la imagen no aplica.
          $SSH "docker run -d --restart unless-stopped \
            --name $WORKER_CONTAINER \
            --memory $WORKER_MEMORY \
            --no-healthcheck \
            --env-file $REMOTE_DIR/m2-cad.env \
            -v m2-cad-data:/app/data \
            -v m2-cad-outputs:/app/outputs \
            $IMAGE_NAME:$IMAGE_TAG \
            uv run --no-sync python -m m2_cad.worker"
          sleep 10
          if [ "$($SSH "docker inspect -f '{{.State.Running}}' $WORKER_CONTAINER")" != "true" ]; then
            $SSH "docker logs --tail 80 $WORKER_CONTAINER" || true
            exit 1
          fi
          # Verifica el puerto publicado desde el host, no solo dentro del contenedor.
          $SSH "curl -fsS -o /dev/null -w 'health HTTP %{http_code}\n' http://127.0.0.1:$APP_PORT/v1/health"
          $SSH "docker image prune -f"
          exit 0
        fi

        if [ "$HEALTH" = "unhealthy" ] || [ "$HEALTH" = "sin-healthcheck" ]; then
          $SSH "docker logs --tail 80 $API_CONTAINER" || true
          exit 1
        fi

        sleep 5
      done

      echo "La API no llegó a healthy en 3 minutos"
      $SSH "docker logs --tail 80 $API_CONTAINER" || true
      exit 1
